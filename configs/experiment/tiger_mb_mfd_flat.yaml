# @package _global_
# MFD (Modality-Factorized Decoding) multi-behavior TIGER experiment.
#
# Identical to tiger_mb_train_flat.yaml in EVERYTHING except the decoder: same data pipeline
# (next_k=4, labels [b,f,t,i], encoder stride 4), same backbone (T5EncoderModel d_model=128,
# 6 heads, d_kv=64, d_ff=1024, 4 layers, mlp_layers=2), same MD-RQ-VAE codebook_sizes and
# init hooks, same MultiBehaviorSIDRetrievalEvaluator. The ONLY change is the model class:
#   SemanticIDMultiBehaviorEncoderDecoder  ->  MFDMultiBehaviorEncoderDecoder
# which drops the chain edge t->i (§12g license) and generates by a compositional beam with
# agreement scoring. This makes ablation (a) chain-vs-factorized a clean same-everything
# comparison: run tiger_mb_train_flat.yaml (chain) vs THIS file (factorized), identical args.
#
# The teacher-forced decoder is 3 positions [BOS, behavior, f]; t and i are predicted by two
# parallel heads reading the SAME h_f (never fed as inputs). The label is still the full
# [b,f,t,i] 4-tuple (t and i are targets) so NextKTokenMasking stays next_k=4 -- MFD slices
# the first two label columns for the decoder input internally.
#
# Required overrides:
#   data_dir=<folder with training/ evaluation/ testing/ sub-dirs of MB TFRecords>
#   semantic_id_path=<path to the MD-RQ-VAE semantic_ids.pt>   (also the catalog constraint)
#   num_hierarchies=3
#
# Launch example:
#   python src/train.py experiment=tiger_mb_mfd_flat \
#       data_dir=/scratch/yw8866/rec-tmall/tfrecords_mb_userdrop \
#       semantic_id_path=/scratch/yw8866/logs/inference/runs/2026-05-06/2048_1024/pickle/semantic_ids.pt \
#       num_hierarchies=3

data_dir: ???
semantic_id_path: ???
num_hierarchies: ???
# Tokens per item in the multi-behavior sequence (1 behavior + H SID levels).
# sequence_length = stride_per_item * max_items_in_window
stride_per_item: ${math_eval:${num_hierarchies}+1}
sequence_length: ${math_eval:${stride_per_item}*40}  # 40 items → 160 tokens for H=3
num_behaviors: 4

# Codebook-geometry embedding injection (optional).
# Set codebook_init_path to a MD-RQ-VAE checkpoint (.ckpt) to replace random
# embedding initialisation with orthogonally up-projected codebook vectors.
# Leave null to use the default random init.
#
# codebook_sizes must list the number of entries per SID level in order
# [K_shared, K_text, K_image] matching the checkpoint's codebook sizes.
# Ignored when codebook_init_path is null.
#
# Usage example:
#   python src/train.py experiment=tiger_mb_train_flat \
#       codebook_init_path=/scratch/yw8866/logs/train/runs/2026-05-06/2048_1024/checkpoints/checkpoint_000_010000.ckpt \
#       data_dir=... semantic_id_path=... num_hierarchies=3
codebook_init_path: null
codebook_sizes:
- 2048
- 1024
- 1024

# Explicit item-level PE + modality TE for the flat sequence (optional).
# When use_item_pe=true, structural embeddings are added to the standard flat encoder:
#   - item_pos_embedding: all (1+H) tokens of item k share positional index k
#     pattern in a sequence of N items: [0,0,0,0, 1,1,1,1, ..., N-1,N-1,N-1,N-1]
#   - modality_type_embedding: within-item slot index (B=0, L0=1, L1=2, L2=3)
#     pattern: [0,1,2,3, 0,1,2,3, ...]
# Sequence length and T5 architecture are unchanged. Mutually exclusive with use_bmtv.
use_item_pe: false
item_pe_max_seq_len: 1024

# Behavior-Modulated Triple-View encoder (optional).
# When use_bmtv=true, the flat token lookup is replaced by the BM-TV wrapper:
#   - builds three orthogonal views per item: V_shared=e_f, V_text=e_t, V_img=e_i
#   - modulates each view via a 3-way Softmax(Linear(e_B)) behavior gate
#   - interleaves triplets and adds item-level PE + modality type embeddings
#   - encoder output length becomes 3*N instead of N*(1+H)
# Decoder and T5 layers are unchanged. Requires num_hierarchies == 3.
use_bmtv: false
bmtv_max_seq_len: 1024

# Loss rebalancing for the behavior class imbalance (optional, independent switches).
# focal_behavior: replace plain CE on the behavior head (position 0) with focal loss,
#   FL = -(1-p_t)^gamma * log(p_t), focusing gradient on hard/rare behaviors (buy/cart/
#   fav) instead of the dominant pv. focal_gamma is the focusing strength. Helps the
#   t3 behavior precision/recall/f1 and t3 joint metrics.
# behavior_weighted_sid: weight each item's SID loss by its TARGET behavior so rare-
#   behavior (buy) interactions get more SID gradient -> helps buy SID retrieval (t1).
#   sid_behavior_weights is indexed by behavior id [pv, fav, cart, buy].
focal_behavior: false
focal_gamma: 2.0
# Optional per-class weights for focal loss, indexed by behavior id [pv, fav, cart, buy].
# null = unweighted (gamma-only). Higher alpha_c => class c contributes more loss.
# NOTE: alpha cannot rescue pv at high gamma — the (1-p_t)^gamma factor zeros easy pv
# regardless of alpha; lower gamma is the primary knob to prevent pv collapse.
focal_alpha: null
behavior_weighted_sid: false
sid_behavior_weights:
- 1.0
- 3.0
- 3.0
- 8.0

# Two-View Semantic Alignment + Retrieval (optional; leverages the MD-RQ-VAE
# addable property v_t=e_f+e_t≈text latent, v_i=e_f+e_i≈image latent).
#   use_semantic_align: TRAIN two heads to predict the next item's (v_t, v_i) from the
#     decoder item-summary hidden state via MSE to a stop-grad target
#     (loss += semantic_align_weight * align_loss). Requires num_hierarchies == 3.
#   use_semantic_rerank: at INFERENCE, reorder the free-gen candidate pool by cosine of
#     the predicted (q_t, q_i) to each candidate's (v_t, v_i). Blend with the decoder
#     score via rerank_weight (0 = decoder only/baseline, 1 = pure semantic retrieval).
#   For rerank to help recall@10 the pool must exceed 10 → widen top_k_for_generation
#   (e.g. 50). Clean ablation: run top_k_for_generation=50 with rerank off (wide-pool
#   baseline) vs on. Train with use_semantic_align=true first so the heads are learned.
use_semantic_align: false
semantic_align_weight: 1.0
# align_loss_type: 'mse' (regress query to the GT view) or 'contrastive' (InfoNCE — the
# query must RANK its GT view above in-batch negatives; matches the cosine rerank at
# inference and forces discriminative, not shared-code, structure). align_temperature is
# the InfoNCE softmax temperature (contrastive only).
align_loss_type: mse
align_temperature: 0.07
use_semantic_rerank: false
rerank_weight: 0.5
# Beam pool size for generation (also the candidate count handed to the evaluator,
# which takes top-K itself). Default 10; set to e.g. 50 for the rerank experiment.
# NOTE: under MFD this is unused for the final pool (mfd_pool_size governs that) but is kept
# for the two-view rerank code path in the parent; leave at 10.
top_k_for_generation: 10

# ------------------------------------------------------------------------------------------
# MFD (Modality-Factorized Decoding) switches. use_modality_factorized is implied by the
# MFDMultiBehaviorEncoderDecoder class; the knobs below drive the compositional beam (§5).
#   mfd_top_k_shared  K_f : (behavior,f) roots kept from the joint behavior/shared beam.
#   mfd_top_k_text    K_t : text codes read from the h_f head per root.
#   mfd_top_k_image   K_i : image codes read from the h_f head per root.
#   mfd_pool_size     K_pool: global candidates kept after catalog filter (evaluator takes
#                     top-10 by score). Effective explored pool = K_f*K_t*K_i (=1000 default),
#                     ~20x the 50-chain-beam at comparable cost, diverse along two axes.
#   mfd_tau           agreement temperature (FROZEN, inference-swept). score = logP(f) +
#                     (1/tau)[logP(t|f)+logP(i|f)]. tau=1 is exact product-of-experts;
#                     tau>1 softens the independence assumption, tau<1 sharpens mutual
#                     verification. Ablation (c): sweep tau in {0.7, 1.0, 1.5}. Learnable tau
#                     is intentionally omitted so the TRAINING path == the chain baseline's.
#   mfd_catalog_constraint : discard (f,t,i) compositions absent from semantic_ids.pt (the
#                     4.16M valid tuples) -- replaces the chain's validity-by-construction.
#   mfd_score_text / mfd_score_image : ablation (b) -- drop one modality's logP from the
#                     score (candidates still enumerated over both axes for catalog validity).
#   mfd_behavior_marginalized : the STRONGER free-gen (t3) pooling. When true, the beam does
#                     NOT commit one behavior: it runs the f-branch decode under ALL nb behavior
#                     tokens, builds a per-behavior candidate pool (each behavior gets its own
#                     top-Kf f-roots), and ranks the UNION by mfd_behavior_weight*logP(b) +
#                     SID_score(.|b). This makes the per-behavior retrieval that wins t2 run
#                     inside t3 by construction. Cost is <=nb x the (cheap) f-branch forward.
#                     When false, falls back to a single behavior-committed (b,f) beam.
#   mfd_behavior_weight w_b : weight on logP(b) in the union ranking. w_b large -> behavior
#                     likelihood dominates (recovers behavior accuracy / pv-heavy); w_b small ->
#                     SID sharpness dominates. The knob that trades t3 behavior-acc vs SID
#                     diversity; sweep on val (try 1.0, 2.0, 4.0). Only affects free-gen (t3);
#                     t2 conditions on GT behavior so w_b is irrelevant there.
mfd_top_k_shared: 10
mfd_top_k_text: 10
mfd_top_k_image: 10
mfd_pool_size: 50
mfd_tau: 1.0
mfd_catalog_constraint: true
mfd_score_text: true
mfd_score_image: true
mfd_behavior_marginalized: true
mfd_behavior_weight: 1.0

# Audit dump (§0 audits). When mfd_audit_dump=true, the test pass writes ONE instrumented
# record per (stratified) test event to mfd_audit_path -- per-behavior pools + beh_logp (0a),
# teacher-forced GT-f branch reads (0b), f*/t*/i* ranks (0c) -- and computes NO eval metrics
# (the three analyses run offline from the .pt). Stratified cap keeps all non-pv events + up
# to mfd_audit_pv_cap pv events, overall <= mfd_audit_max_events. Run test-only on a frozen ckpt.
mfd_audit_dump: false
mfd_audit_path: /scratch/yw8866/rec-tmall/mfd_audit_dump.pt
mfd_audit_max_events: 200000
mfd_audit_pv_cap: 100000

# Semantic near-miss probe (eval-only diagnostic; no effect on training).
# When probe_sid_distance=true, the test/val loop measures, among MISS cases (GT SID
# tuple not in the top-k generated), the cosine similarity of the best-beam predicted
# SID to the GT SID in the MD-RQ-VAE reconstruction space (v_t=e_f+e_t, v_i=e_f+e_i),
# versus a random in-batch item — per behavior + overall. Logs probe_{group}_miss_
# {pred_sim,rand_sim,frac}. Tells near-miss (pred_sim >> rand_sim, retrieval can help)
# from genuine unpredictability (pred_sim ≈ rand_sim). Requires num_hierarchies == 3.
probe_sid_distance: false

task_name: train
id: ${now:%Y-%m-%d}/${now:%H-%M-%S}
tags:
- tiger-mb-mfd
train: true
test: true
ckpt_path: null
seed: 42

data_loading:
  features_config:
    features:
    - name: sequence_data
      num_placeholder_tokens: 0
      semantic_ids: ???
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_:
        - int32
    - name: behavior_data
      num_placeholder_tokens: 0
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_:
        - int32
    - name: user_id
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_:
        - int32

  dataset_config:
    dataset:
      _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
      user_id_field: user_id
      min_sequence_length: 1
      iterate_per_row: true
      keep_user_id: true
      features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features_config.features},
        "name", False, "is_item_ids", "True"}
      num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
        "name", "num_placeholder_tokens"}
      semantic_id_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
        "name", "semantic_ids"}
      data_iterator:
        _target_: src.data.loading.components.iterators.TFRecordIterator
      preprocessing_functions:
      - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
        _partial_: true
      - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
        _partial_: true
        features_to_apply:
        - sequence_data
        num_hierarchies: ${model.num_hierarchies}

  train_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/training
      should_shuffle_rows: true
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${stride_per_item}
      batch_size_per_device: 32
      num_workers: 16
      timeout: 60
      assign_files_by_size: false
      oov_token: null
      masking_token: -1
      sequence_length: ${sequence_length}
      padding_token: -1
      drop_last: true
      persistent_workers: true
      pin_memory: true
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_with_behavior_sid_causal_duplicate
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
        sequence_field_name: sequence_data
        behavior_field_name: behavior_data
        sid_hierarchy: ${model.num_hierarchies}
        max_batch_size: 1024
      dataset_config:
        _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
        user_id_field: user_id
        min_sequence_length: 1
        iterate_per_row: true
        keep_user_id: true
        features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features_config.features},
          "name", False, "is_item_ids", "True"}
        num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features_config.features},
          "name", "num_placeholder_tokens"}
        semantic_id_map:
          sequence_data:
            _target_: torch.load
            _args_:
            - _target_: src.utils.file_utils.open_local_or_remote
              file_path: ${semantic_id_path}
              mode: rb
        data_iterator:
          _target_: src.data.loading.components.iterators.TFRecordIterator
        preprocessing_functions:
        - _target_: src.data.loading.components.pre_processing.filter_features_to_consider
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
          _partial_: true
        - _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
          _partial_: true
          features_to_apply:
          - sequence_data
          num_hierarchies: ${model.num_hierarchies}
      assign_all_files_per_worker: true

  val_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/evaluation
      should_shuffle_rows: false
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${stride_per_item}
      batch_size_per_device: 64
      num_workers: 8
      timeout: 60
      assign_files_by_size: true
      oov_token: ${data_loading.train_dataloader_config.dataloader.oov_token}
      masking_token: ${data_loading.train_dataloader_config.dataloader.masking_token}
      sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      drop_last: false
      persistent_workers: true
      pin_memory: true
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_with_behavior_interleave
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
        sequence_field_name: sequence_data
        behavior_field_name: behavior_data
        sid_hierarchy: ${model.num_hierarchies}
      dataset_config: ${data_loading.train_dataloader_config.dataloader.dataset_config}

  test_dataloader_config:
    dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class:
        _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
        _partial_: true
      data_folder: ${paths.data_dir}/testing
      should_shuffle_rows: false
      labels:
        sequence_data:
          transform:
            _target_: src.data.loading.components.label_function.NextKTokenMasking
            next_k: ${stride_per_item}
      batch_size_per_device: 64
      num_workers: 8
      timeout: 60
      assign_files_by_size: true
      oov_token: ${data_loading.train_dataloader_config.dataloader.oov_token}
      masking_token: ${data_loading.train_dataloader_config.dataloader.masking_token}
      sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
      drop_last: false
      persistent_workers: true
      pin_memory: true
      collate_fn:
        _target_: src.data.loading.components.collate_functions.collate_with_behavior_interleave
        _partial_: true
        sequence_length: ${data_loading.train_dataloader_config.dataloader.sequence_length}
        padding_token: ${data_loading.train_dataloader_config.dataloader.padding_token}
        sequence_field_name: sequence_data
        behavior_field_name: behavior_data
        sid_hierarchy: ${model.num_hierarchies}
      dataset_config: ${data_loading.train_dataloader_config.dataloader.dataset_config}

  datamodule:
    _target_: src.data.loading.datamodules.sequence_datamodule.SequenceDataModule
    train_dataloader_config: ${..train_dataloader_config.dataloader}
    val_dataloader_config: ${..val_dataloader_config.dataloader}
    test_dataloader_config: ${..test_dataloader_config.dataloader}

model:
  huggingface_model:
    _target_: transformers.T5EncoderModel
    config:
      _target_: transformers.T5Config
      vocab_size: 256
      d_model: 128
      num_heads: 6
      dropout_rate: 0.15
      d_ff: 1024
      d_kv: 64
      num_layers: 4
  _target_: src.models.modules.semantic_id.mfd_generation_model.MFDMultiBehaviorEncoderDecoder
  # --- MFD (Modality-Factorized Decoding) params (mirror the top-level switches) ---
  use_modality_factorized: true
  mfd_top_k_shared: ${mfd_top_k_shared}
  mfd_top_k_text: ${mfd_top_k_text}
  mfd_top_k_image: ${mfd_top_k_image}
  mfd_pool_size: ${mfd_pool_size}
  mfd_tau: ${mfd_tau}
  mfd_catalog_constraint: ${mfd_catalog_constraint}
  mfd_score_text: ${mfd_score_text}
  mfd_score_image: ${mfd_score_image}
  mfd_behavior_marginalized: ${mfd_behavior_marginalized}
  mfd_behavior_weight: ${mfd_behavior_weight}
  mfd_audit_dump: ${mfd_audit_dump}
  mfd_audit_path: ${mfd_audit_path}
  mfd_audit_max_events: ${mfd_audit_max_events}
  mfd_audit_pv_cap: ${mfd_audit_pv_cap}
  feature_to_model_input_map:
    sequence_data: input_ids
    user_id: user_id
  postprocessor: null
  aggregator: null
  loss_function: ${loss.loss_function}
  optimizer: ${optim.optimizer}
  scheduler: ${optim.scheduler}
  evaluator: ${eval.evaluator}
  weight_tying: true
  compile: false
  decoder:
    _target_: transformers.models.t5.modeling_t5.T5Stack
    config:
      _target_: transformers.models.t5.configuration_t5.T5Config
      vocab_size: ${model.huggingface_model.config.vocab_size}
      d_model: ${model.huggingface_model.config.d_model}
      num_heads: ${model.huggingface_model.config.num_heads}
      dropout_rate: 0.15
      d_ff: ${model.huggingface_model.config.d_ff}
      d_kv: ${model.huggingface_model.config.d_kv}
      num_layers: 4
      is_decoder: true
      is_encoder_decoder: false
    embed_tokens:
      _target_: torch.nn.Embedding
      num_embeddings: ${model.huggingface_model.config.vocab_size}
      embedding_dim: ${model.huggingface_model.config.d_model}
  num_hierarchies: ${num_hierarchies}
  num_behaviors: ${num_behaviors}
  num_user_bins: null
  codebooks: ${data_loading.train_dataloader_config.dataloader.dataset_config.semantic_id_map.sequence_data}
  mlp_layers: 2
  # Codebook-geometry injection — mirrors the top-level switches
  codebook_init_path: ${codebook_init_path}
  codebook_sizes: ${codebook_sizes}
  # Flat-sequence item PE — mirrors the top-level switches
  use_item_pe: ${use_item_pe}
  item_pe_max_seq_len: ${item_pe_max_seq_len}
  # BM-TV encoder — mirrors the top-level switches
  use_bmtv: ${use_bmtv}
  bmtv_max_seq_len: ${bmtv_max_seq_len}
  # Loss rebalancing — mirrors the top-level switches
  focal_behavior: ${focal_behavior}
  focal_gamma: ${focal_gamma}
  focal_alpha: ${focal_alpha}
  behavior_weighted_sid: ${behavior_weighted_sid}
  sid_behavior_weights: ${sid_behavior_weights}
  # Two-View semantic align + rerank — mirrors the top-level switches
  use_semantic_align: ${use_semantic_align}
  semantic_align_weight: ${semantic_align_weight}
  align_loss_type: ${align_loss_type}
  align_temperature: ${align_temperature}
  use_semantic_rerank: ${use_semantic_rerank}
  rerank_weight: ${rerank_weight}
  top_k_for_generation: ${top_k_for_generation}

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: checkpoint_{epoch:03d}_{step:06d}
    monitor: val/t2_recall_5
    verbose: true
    save_last: null
    save_top_k: 1
    mode: max
    auto_insert_metric_name: true
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: ${callbacks.model_checkpoint.monitor}
    min_delta: 0.0
    patience: 6
    verbose: true
    mode: ${callbacks.model_checkpoint.mode}
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: false
  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1
  restart_job:
    _target_: src.utils.restart_job.RestartAndLoadCheckpointCallback
    metadata_dir: ${paths.metadata_dir}

logger:
  csv:
    _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
    save_dir: ${paths.output_dir}
    name: csv/
    prefix: ''
  wandb:
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    project: MMMBGRec
    name: tiger-mb-${now:%Y-%m-%d_%H-%M-%S}
    save_dir: ${paths.output_dir}

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_steps: 1
  max_steps: 320000
  max_epochs: 10
  accelerator: gpu
  devices: -1
  num_nodes: 1
  precision: 32-true
  log_every_n_steps: 100
  val_check_interval: 5000
  limit_val_batches: 500
  deterministic: false
  accumulate_grad_batches: 4
  profiler:
    _target_: lightning.pytorch.profilers.PassThroughProfiler
  strategy: ddp
  sync_batchnorm: true
  num_sanity_val_steps: 0
  min_epochs: 0

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  enforce_tags: true
  print_config_warnings: true
  print_config: true

loss:
  loss_function:
    _target_: torch.nn.CrossEntropyLoss

optim:
  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr: 0.001
    weight_decay: 0.0001
  scheduler: null

eval:
  evaluator:
    _target_: src.components.eval_metrics.MultiBehaviorSIDRetrievalEvaluator
    buy_behavior_id: 3
    probe_sid_distance: ${probe_sid_distance}
    top_k_list:
    - 5
    - 10
    metrics:
      ndcg:
        _target_: src.components.eval_metrics.NDCG
        _partial_: true
      recall:
        _target_: src.components.eval_metrics.Recall
        _partial_: true